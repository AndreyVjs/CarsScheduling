spring.application.name=car-scheduling

# Configurações de DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/CarScheduling?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=162534andrey.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Como você usa Flyway, o ideal é que o Hibernate apenas valide o schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Local onde ficam as migrations: src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration

server.port=3000
